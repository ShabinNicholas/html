<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            box-sizing: border-box;
        }                                                      

        .main {
            height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 50px;
            padding: 50px;
           
        }
        .box{
            border: 2px solid blueviolet;
             border-radius: 50px;
             display: flex;
             justify-content: center;
             align-items: center;
             font-size: 70px;
             font-weight: bolder;
        }

        @media (max-width: 768px) {
            .main{
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="box">A</div>
        <div class="box">B</div>
        <div class="box">C</div>
        <div class="box">D</div>
        <div class="box">E</div>
        <div class="box">F</div>
        <div class="box">G</div>
        <div class="box">H</div>
        <div class="box">I</div>
    </div>
</body>

</html>
